<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-labelledby="lifeTitle lifeDesc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="lifeTitle">Launch and folder behaviour</title>
  <desc id="lifeDesc">On launch the app reads the remembered folder and starts the engine there; with nothing remembered it asks for a folder first. Later, choosing the same folder changes nothing, while choosing a different folder starts a new session there and leaves the previous conversation on disk as history.</desc>

  <rect x="0" y="0" width="920" height="500" rx="16" fill="#f6f8fa"/>
  <text x="40" y="44" font-size="12" font-weight="700" fill="#57606a" letter-spacing="1.2">LAUNCH AND FOLDER BEHAVIOUR</text>

  <!-- column 1: launch with a remembered folder -->
  <rect x="24" y="64" width="272" height="352" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="94" font-size="15" font-weight="700" fill="#1f2328">Launch</text>
  <text x="44" y="112" font-size="12.5" fill="#8c959f">a folder was used last</text>
  <line x1="44" y1="122" x2="276" y2="122" stroke="#d0d7de" stroke-width="1"/>
  <rect x="44" y="138" width="232" height="36" rx="8" fill="#eef4fb" stroke="#0969da" stroke-width="1"/>
  <text x="58" y="161" font-size="13" fill="#1f2328">App starts</text>
  <rect x="44" y="188" width="232" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="211" font-size="13" fill="#1f2328">Read the remembered folder</text>
  <rect x="44" y="238" width="232" height="36" rx="8" fill="#eef6ee" stroke="#1a7f37" stroke-width="1"/>
  <text x="58" y="261" font-size="13" fill="#116329">Engine starts there</text>
  <text x="58" y="302" font-size="12.5" fill="#8c959f">The engine starts before the window</text>
  <text x="58" y="320" font-size="12.5" fill="#8c959f">exists, so its first questions reach a</text>
  <text x="58" y="338" font-size="12.5" fill="#8c959f">child instead of a stopped host.</text>
  <rect x="44" y="356" width="232" height="36" rx="8" fill="#fff8e6" stroke="#9a6700" stroke-width="1"/>
  <text x="58" y="379" font-size="13" fill="#7a4f01">Nothing remembered → ask</text>

  <!-- column 2: first run -->
  <rect x="324" y="64" width="272" height="352" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="344" y="94" font-size="15" font-weight="700" fill="#1f2328">First run</text>
  <text x="344" y="112" font-size="12.5" fill="#8c959f">nothing remembered yet</text>
  <line x1="344" y1="122" x2="576" y2="122" stroke="#d0d7de" stroke-width="1"/>
  <rect x="344" y="138" width="232" height="36" rx="8" fill="#eef8fb" stroke="#0969da" stroke-width="1"/>
  <text x="358" y="161" font-size="13" fill="#1f2328">The system folder picker</text>
  <rect x="344" y="188" width="232" height="36" rx="8" fill="#eef6ee" stroke="#1a7f37" stroke-width="1"/>
  <text x="358" y="211" font-size="13" fill="#116329">Chosen → remembered, starts</text>
  <rect x="344" y="238" width="232" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="358" y="261" font-size="13" fill="#1f2328">Cancelled → opens anyway</text>
  <text x="358" y="296" font-size="12.5" fill="#8c959f">in the app's own folder, said</text>
  <text x="358" y="314" font-size="12.5" fill="#8c959f">plainly in the header</text>
  <rect x="344" y="332" width="232" height="36" rx="8" fill="#fff8e6" stroke="#9a6700" stroke-width="1"/>
  <text x="358" y="355" font-size="13" fill="#7a4f01">Next launch asks again</text>

  <!-- column 3: later -->
  <rect x="624" y="64" width="272" height="352" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="644" y="94" font-size="15" font-weight="700" fill="#1f2328">Later: change it</text>
  <text x="644" y="112" font-size="12.5" fill="#8c959f">from the header or the Gentle window</text>
  <line x1="644" y1="122" x2="876" y2="122" stroke="#d0d7de" stroke-width="1"/>
  <rect x="644" y="138" width="232" height="36" rx="8" fill="#eef4fb" stroke="#0969da" stroke-width="1"/>
  <text x="658" y="161" font-size="13" fill="#1f2328">Choose a folder</text>
  <rect x="644" y="188" width="232" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="658" y="211" font-size="13" fill="#1f2328">Same folder → nothing happens</text>
  <rect x="644" y="238" width="232" height="36" rx="8" fill="#eef6ee" stroke="#1a7f37" stroke-width="1"/>
  <text x="658" y="261" font-size="13" fill="#116329">Different → new session there</text>
  <text x="658" y="296" font-size="12.5" fill="#8c959f">The previous conversation is not</text>
  <text x="658" y="314" font-size="12.5" fill="#8c959f">carried over: it stays on disk as</text>
  <text x="658" y="332" font-size="12.5" fill="#8c959f">history, in the history picker.</text>
  <rect x="644" y="352" width="232" height="36" rx="8" fill="#fff8e6" stroke="#9a6700" stroke-width="1"/>
  <text x="658" y="375" font-size="13" fill="#7a4f01">Fail → previous folder restored</text>

  <text x="40" y="452" font-size="12.5" fill="#8c959f">A folder the engine cannot start in restores the previous folder with its conversation, and the toast says why.</text>
  <text x="40" y="474" font-size="12.5" fill="#8c959f">An agent's model is frozen when a session starts, which is why model changes apply to the next session.</text>
</svg>
